<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#222222">
<title>Release Control // Scrum Semana 7</title>
<style>
:root{--red:#cc0000;--char:#222;--panel:#2d2d2d;--line:#454545;--blue:#00bfff;--muted:#bfc0c2;--white:#fff;--soft:#f5f5f5}
*{box-sizing:border-box}html,body{margin:0;background:var(--char);color:#fff;font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh;background:linear-gradient(#202020,#272727 55%,#202020)}
.top{position:sticky;top:0;z-index:20;height:68px;padding:0 clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;background:#222e;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.brand{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-weight:800}.brand b{display:block;font-size:.9rem;letter-spacing:.05em}.brand small,.mono{font-family:monospace;color:#aeb4b7;font-size:.68rem}.online{font-family:monospace;font-size:.72rem}.online:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.3}}
.telemetry{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#444;border-bottom:1px solid #444}.g{background:#272727;padding:11px 18px}.g div{display:flex;justify-content:space-between;font-family:monospace;font-size:.7rem}.bar{height:3px;background:#444;margin-top:8px}.bar i{display:block;height:100%;background:var(--blue);transition:.5s}.bar i.r{background:var(--red)}
.stage{display:flex;gap:10px;padding:10px clamp(16px,4vw,48px);overflow:auto;border-bottom:1px solid var(--line);font-family:monospace;font-size:.65rem;color:#6e6e6e}.stage span.on{color:#fff}.stage span.done{color:#9ccddd}
.screen{width:min(1400px,calc(100% - 28px));margin:auto;padding:clamp(28px,5vw,62px) 0}.grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px}.box{border:1px solid var(--line);border-radius:8px;background:#2a2a2a;padding:clamp(22px,4vw,42px)}
.k{font-family:monospace;color:var(--blue);font-size:.72rem;letter-spacing:.08em}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;min-height:calc(100vh - 68px)}
h1{font-size:clamp(3rem,7vw,7rem);line-height:.84;letter-spacing:-.065em;margin:18px 0}h1 em{font-style:normal;color:var(--red)}h2{font-size:clamp(2rem,4vw,4rem);line-height:.98;letter-spacing:-.05em;margin:12px 0}p{color:var(--muted);line-height:1.65}
.form{background:var(--soft);color:#222}.form label{display:block;font-size:.82rem;font-weight:700;margin:14px 0}.form input{width:100%;margin-top:7px;padding:13px;border:1px solid #bbb;border-radius:8px;font-size:1rem}.primary,.ghost{border:0;border-radius:8px;padding:14px 18px;font-weight:800}.primary{background:var(--red);color:#fff}.ghost{background:transparent;border:1px solid var(--line);color:#fff}.wide{width:100%;margin-top:18px}
.checks,.cards,.decisions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.check,.card,.choice,.decision,.cat{border:1px solid var(--line);border-radius:8px;background:#303030;color:#fff;padding:16px;text-align:left}.check.on{border-color:var(--blue);background:#29363a}.check small,.card small{display:block;color:#888;font-family:monospace;margin-top:5px}.card:hover,.choice:hover,.decision:hover,.cat:hover{border-color:var(--blue);transform:translateY(-2px)}
.risk{margin-top:16px;padding:16px;border-left:4px solid var(--red);background:#3a2424}.risk.safe{border-color:var(--blue);background:#243238}.risk strong{display:block;font-size:1.5rem;margin:4px 0}
.side{display:flex;flex-direction:column;gap:12px}.mini{border:1px solid var(--line);border-radius:8px;background:#2a2a2a;padding:16px}.nodes{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}.node{aspect-ratio:1;border-radius:3px;background:#444}.node.active{background:var(--blue)}.node.error{background:var(--red);animation:pulse 1s infinite}
.log{font-family:monospace;font-size:.62rem;color:#aaa;border-top:1px solid #3d3d3d;padding:8px 0}.alarm{font-family:monospace;color:#ff8888;font-size:.74rem;margin-bottom:12px}.choice{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;margin:9px 0}.choice span{width:32px;height:32px;border-radius:6px;background:#404040;display:grid;place-items:center;font-family:monospace}
.feedback{border:1px solid var(--line);background:#252525;border-radius:8px;padding:26px;margin-top:20px}.feedback q{font-size:clamp(1.3rem,2.5vw,2rem);line-height:1.3}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.cat{text-align:center;font-family:monospace;font-size:.7rem}
.result{display:grid;grid-template-columns:.8fr 1.2fr;gap:20px}.score{width:160px;height:160px;border-radius:50%;border:8px solid var(--blue);display:flex;justify-content:center;align-items:center;font-family:monospace;font-size:3.7rem;margin:24px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{border:1px solid var(--line);border-radius:8px;padding:15px}.stat span{display:block;font-family:monospace;color:#888;font-size:.64rem;margin-bottom:6px}
@media(max-width:900px){.grid,.hero,.result{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .mini:last-child{grid-column:1/-1}}@media(max-width:650px){.telemetry{grid-template-columns:1fr 1fr}.checks,.cards,.decisions,.stats{grid-template-columns:1fr}.cats{grid-template-columns:1fr 1fr}.side{grid-template-columns:1fr}.side .mini:last-child{grid-column:auto}.online{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><span class="mark">R</span><div><b>RELEASE CONTROL</b><small>SCRUM // WEEK 07</small></div></div><div class="online">SYSTEM ONLINE</div></header>
<div id="telemetry" class="telemetry" hidden></div>
<div id="stages" class="stage" hidden></div>
<main id="screen"></main>
</div>
<script>
const readiness=[
{id:'tests',label:'Pruebas funcionales',critical:1},{id:'data',label:'Datos conectados',critical:1},{id:'roles',label:'Permisos y roles',critical:1},{id:'support',label:'Soporte definido',critical:1},{id:'training',label:'Usuarios capacitados',critical:0},{id:'rollback',label:'Plan de rollback',critical:1}
];
const strategies=[
{id:'mass',name:'Lanzamiento masivo',sub:'50 obras de una vez',risk:24,adoption:8,value:18,confidence:-12,nodes:50},
{id:'pilot',name:'Piloto controlado',sub:'5 obras durante 2 semanas',risk:-6,adoption:12,value:10,confidence:14,nodes:5},
{id:'progressive',name:'Despliegue progresivo',sub:'5 → 15 → 50 obras',risk:-10,adoption:15,value:16,confidence:18,nodes:15},
{id:'delay',name:'Posponer release',sub:'Más preparación antes de salir',risk:-12,adoption:-5,value:-7,confidence:6,nodes:0}
];
const incidents=[
{t:'INCIDENT 01 // ACCESS',h:'Dos gerentes no pueden ingresar por permisos.',d:'Los perfiles regionales quedaron fuera de la matriz de acceso.',error:2,o:[
['Continuar y registrar el problema',{risk:16,adoption:-12,value:-3,confidence:-15},'bad'],['Pausar activaciones y corregir permisos',{risk:-10,adoption:-2,value:1,confidence:12},'good'],['Rollback total del piloto',{risk:-14,adoption:-14,value:-8,confidence:-2},'mid']]},
{t:'INCIDENT 02 // DATA',h:'Un proveedor dejó de actualizar datos durante 6 horas.',d:'Parte de la información ya no está fresca.',error:4,o:[
['Ocultar el retraso y esperar',{risk:20,adoption:-10,value:-6,confidence:-18},'bad'],['Mostrar alerta y activar contingencia',{risk:-8,adoption:2,value:4,confidence:10},'good'],['Desactivar todo el sistema',{risk:-10,adoption:-12,value:-8,confidence:-4},'mid']]},
{t:'INCIDENT 03 // MARKET SIGNAL',h:'La función más usada no era la esperada.',d:'El 84% consulta alertas; la galería histórica casi no se usa.',error:0,o:[
['Ignorar: el roadmap ya estaba definido',{risk:8,adoption:-10,value:-12,confidence:-8},'bad'],['Registrar aprendizaje y repriorizar backlog',{risk:-4,adoption:10,value:14,confidence:10},'good'],['Eliminar de inmediato la galería',{risk:5,adoption:1,value:0,confidence:-2},'mid']]}
];
const feedback=[
['Necesito alertas por WhatsApp cuando una obra quede en rojo.','SOLICITUD'],['El semáforo me permite priorizar reuniones de seguimiento.','VALOR'],['En móvil algunos filtros quedan cortados.','ERROR'],['No sé qué significa “desviación acumulada”.','EXPERIENCIA'],['Me ahorra revisar tres archivos de Excel.','VALOR'],['El tablero tarda mucho con conexión de obra.','ERROR']
];
const cats=['ERROR','SOLICITUD','EXPERIENCIA','VALOR'];
let state={stage:'register',user:{},ready:{},m:{value:54,risk:38,adoption:18,confidence:58},nodes:0,incident:0,good:0,fb:0,fbScore:0,final:null,strategy:null,log:['SYSTEM // Esperando identificación.']};
const clamp=x=>Math.max(0,Math.min(100,x));const el=id=>document.getElementById(id);
function change(e){for(const k of ['value','risk','adoption','confidence'])state.m[k]=clamp(state.m[k]+(e[k]||0))}
function log(x){state.log.unshift(x);state.log=state.log.slice(0,6)}
function telemetry(){el('telemetry').hidden=state.stage==='register';el('stages').hidden=state.stage==='register';el('telemetry').innerHTML=['value','risk','adoption','confidence'].map(k=>'<div class="g"><div><span>'+k.toUpperCase()+'</span><b>'+Math.round(state.m[k])+'</b></div><div class="bar"><i class="'+(k==='risk'?'r':'')+'" style="width:'+state.m[k]+'%"></i></div></div>').join('');let order=['readiness','strategy','incidents','market','final','result'];let i=order.indexOf(state.stage);el('stages').innerHTML=order.map((x,j)=>'<span class="'+(j===i?'on':j<i?'done':'')+'">'+x.toUpperCase()+'</span>').join(' → ')}
function nodes(error=0){return '<div class="nodes">'+Array.from({length:50},(_,i)=>'<i class="node '+(i<state.nodes?'active ':'')+(i<error?'error':'')+'"></i>').join('')+'</div>'}
function logs(){return '<div class="mini"><div class="k">EVENT LOG</div>'+state.log.map((x,i)=>'<div class="log">'+String(i+1).padStart(2,'0')+' '+x+'</div>').join('')+'</div>'}
function side(error=0){return '<aside class="side"><div class="mini"><div class="k">DEPLOYMENT MAP</div>'+nodes(error)+'<p class="mono">Cada nodo representa una obra.</p></div>'+logs()+'</aside>'}
function render(){
telemetry();let s=el('screen');
if(state.stage==='register'){s.className='screen hero';s.innerHTML='<section><div class="k">MISSION 07 // PRODUCT RELEASE</div><h1>Launch.<br><em>Observe.</em><br>Decide.</h1><p>Tu equipo terminó varios Sprint. Ahora debes decidir cómo llevar el incremento al mundo real sin perder control sobre valor, riesgo y aprendizaje.</p></section><section class="box form"><div class="k">IDENTIFY OPERATOR</div><h2>Registro</h2><label>Nombre<input id="name"></label><label>Apellido<input id="last"></label><label>Carrera<input id="career"></label><button id="start" class="primary wide">INICIAR CONTROL →</button></section>';el('start').onclick=()=>{let u={name:el('name').value.trim(),last:el('last').value.trim(),career:el('career').value.trim()};if(!u.name||!u.last||!u.career)return alert('Completa nombre, apellido y carrera.');state.user=u;state.stage='readiness';log('USER // '+u.name+' '+u.last+' autenticado.');render()};return}
if(state.stage==='readiness'){let miss=readiness.filter(x=>x.critical&&!state.ready[x.id]);let pct=Math.round(readiness.filter(x=>state.ready[x.id]).length/readiness.length*100);s.className='screen grid';s.innerHTML='<section class="box"><div class="k">01 // RELEASE READINESS SCANNER</div><h2>¿Está realmente listo para salir?</h2><p>Activa las condiciones que consideras resueltas. Lo crítico pendiente aumentará el riesgo.</p><div class="checks">'+readiness.map(x=>'<button class="check '+(state.ready[x.id]?'on':'')+'" data-id="'+x.id+'"><b>'+x.label+'</b><small>'+(x.critical?'CRÍTICO':'RECOMENDADO')+'</small></button>').join('')+'</div><div class="risk '+(!miss.length?'safe':'')+'"><span class="mono">RELEASE RISK</span><strong>'+(!miss.length?'CONTROLLED':miss.length<=2?'ELEVATED':'HIGH')+'</strong><small>'+miss.length+' crítica(s) pendiente(s)</small></div><button id="auth" class="primary wide">AUTORIZAR SIGUIENTE FASE →</button></section>'+side();document.querySelectorAll('.check').forEach(b=>b.onclick=()=>{state.ready[b.dataset.id]=!state.ready[b.dataset.id];render()});el('auth').onclick=()=>{if(miss.length){change({risk:miss.length*8,confidence:-miss.length*6});log('WARNING // '+miss.length+' condición(es) críticas pendientes.')}else{change({risk:-8,confidence:10,value:4});log('READY // Condiciones críticas validadas.')}state.stage='strategy';render()};return}
if(state.stage==='strategy'){s.className='screen grid';s.innerHTML='<section class="box"><div class="k">02 // DEPLOYMENT STRATEGY</div><h2>Elige cómo exponer el producto.</h2><p>Cada estrategia cambia velocidad, riesgo, aprendizaje y confianza.</p><div class="cards">'+strategies.map((x,i)=>'<button class="card" data-i="'+i+'"><div class="k">'+(x.id==='mass'?'HIGH EXPOSURE':'CONTROLLED')+'</div><h3>'+x.name+'</h3><p>'+x.sub+'</p><small>RIESGO '+(x.risk>0?'+':'')+x.risk+' · VALOR '+(x.value>0?'+':'')+x.value+' · ADOPCIÓN '+(x.adoption>0?'+':'')+x.adoption+'</small></button>').join('')+'</div></section>'+side();document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{let x=strategies[+b.dataset.i];state.strategy=x.id;state.nodes=x.nodes;change(x);log('DEPLOY // '+x.name);state.stage='incidents';render()});return}
if(state.stage==='incidents'){let x=incidents[state.incident];s.className='screen grid';s.innerHTML='<section class="box"><div class="alarm">'+x.t+'</div><h2>'+x.h+'</h2><p>'+x.d+'</p>'+x.o.map((o,i)=>'<button class="choice" data-i="'+i+'"><span>'+String.fromCharCode(65+i)+'</span><b>'+o[0]+'</b></button>').join('')+'</section>'+side(x.error);document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{let o=x.o[+b.dataset.i];change(o[1]);if(o[2]==='good')state.good++;log((o[2]==='good'?'RESOLVED':'DECISION')+' // '+o[0]);state.incident++;if(state.incident>=incidents.length)state.stage='market';render()});return}
if(state.stage==='market'){let f=feedback[state.fb];s.className='screen grid';s.innerHTML='<section class="box"><div class="k">04 // MARKET RADAR + AI</div><h2>El mercado ya está hablando.</h2><p>Clasifica la señal. La IA organiza feedback; el criterio gerencial sigue siendo humano.</p><div class="feedback"><q>'+f[0]+'</q><div class="mono">SIGNAL '+(state.fb+1)+'/'+feedback.length+'</div></div><div class="cats">'+cats.map(c=>'<button class="cat" data-c="'+c+'">'+c+'</button>').join('')+'</div></section>'+side();document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{if(b.dataset.c===f[1]){state.fbScore++;change({value:2,confidence:2})}else change({confidence:-2});log('AI CHECK // '+b.dataset.c);state.fb++;if(state.fb>=feedback.length)state.stage='final';render()});return}
if(state.stage==='final'){let rec=recommend();s.className='screen grid';s.innerHTML='<section class="box"><div class="k">05 // EXECUTIVE DECISION</div><h2>El sistema necesita una decisión.</h2><p>Analiza telemetría, incidentes y aprendizaje. ¿Qué harías?</p><div class="decisions">'+['ESCALAR','MANTENER PILOTO','CORREGIR Y RELANZAR','ROLLBACK'].map(d=>'<button class="decision" data-d="'+d+'"><span class="mono">FINAL ACTION</span><h3>'+d+'</h3></button>').join('')+'</div><p class="mono">SYSTEM HINT // la recomendación depende de riesgo, adopción, valor y confianza.</p></section>'+side();document.querySelectorAll('.decision').forEach(b=>b.onclick=()=>{state.final=b.dataset.d;log('FINAL // '+state.final);state.stage='result';render()});return}
if(state.stage==='result'){let rec=recommend(),score=scoreCalc(rec),profile=score>=90?'Release Strategist':score>=75?'Release Manager':score>=60?'Release Operator':'Release Explorer';s.className='screen result';s.innerHTML='<section class="box"><div class="k">MISSION COMPLETE</div><div class="score">'+score+'%</div><h2>'+profile+'</h2><p>Resultado basado en preparación, gestión de incidentes, lectura del mercado y decisión final.</p><button id="pdf" class="primary">DESCARGAR CERTIFICADO</button> <button id="reset" class="ghost">REPETIR</button></section><section class="box stats">'+[['DECISIÓN',state.final],['RECOMENDACIÓN',rec],['INCIDENTES BIEN RESUELTOS',state.good+'/'+incidents.length],['FEEDBACK CLASIFICADO',state.fbScore+'/'+feedback.length],['VALOR FINAL',Math.round(state.m.value)],['RIESGO FINAL',Math.round(state.m.risk)],['ADOPCIÓN',Math.round(state.m.adoption)+'%'],['CONFIANZA',Math.round(state.m.confidence)+'%']].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</section>';el('reset').onclick=()=>{location.reload()};el('pdf').onclick=()=>certificate(score,profile,rec);return}
}
function recommend(){if(state.m.risk>=65)return'CORREGIR Y RELANZAR';if(state.m.adoption<35||state.m.confidence<45)return'MANTENER PILOTO';if(state.m.value>=65&&state.m.risk<=45&&state.m.adoption>=55)return'ESCALAR';return'MANTENER PILOTO'}
function scoreCalc(rec){let ready=readiness.filter(x=>state.ready[x.id]).length/readiness.length*100;let strat=['pilot','progressive'].includes(state.strategy)?100:state.strategy==='delay'?68:42;return Math.round(ready*.22+strat*.18+(state.good/incidents.length*100)*.25+(state.fbScore/feedback.length*100)*.15+(state.final===rec?100:45)*.20)}
function certificate(score,profile,rec){let w=window.open('','_blank');w.document.write('<html><head><title>Certificado</title><style>body{font-family:Arial;padding:60px;text-align:center;border:12px solid #222}h1{font-size:42px}h2{font-size:34px;color:#cc0000}.line{height:6px;background:#00bfff;margin:35px 0}</style></head><body><p>SCRUM // WEEK 07 // RELEASE CONTROL</p><h1>CERTIFICADO DE SIMULACIÓN</h1><p>Se certifica que</p><h2>'+state.user.name+' '+state.user.last+'</h2><p>'+state.user.career+'</p><p>completó Release Control — simulación de lanzamiento, riesgo y aprendizaje.</p><h3>'+score+'% · '+profile+'</h3><div class="line"></div><p>Decisión: '+state.final+' · Recomendación: '+rec+'</p><p>Use Imprimir → Guardar como PDF</p><script>setTimeout(()=>print(),500)<\/script></body></html>');w.document.close()}
render();
</script>
</body></html>
